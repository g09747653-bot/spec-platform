name: CI

# Constitution — Testing Approaches, Rules: "CI is red-blocking: all four mandatory suites must
# pass before merge." Every job below must be added to the branch protection rule for `main` as a
# required status check; the workflow makes failures visible, branch protection makes them binding.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing here is a real credential — CI must never hold one (constitution S1).
  #
  # The unit suite runs its database tests against PGlite, an in-process PostgreSQL, and the E2E suite
  # against a throwaway PGlite server started by Playwright (D-18); neither reads these values. They
  # exist to satisfy the Zod environment loader, which refuses to boot the app — and therefore the
  # build — without them (task 7, D-8).
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci-not-a-real-database
  AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret=
  AUTH_GOOGLE_ID: ci-not-a-real-google-client-id
  AUTH_GOOGLE_SECRET: ci-not-a-real-google-client-secret
  AUTH_GITHUB_ID: ci-not-a-real-github-client-id
  AUTH_GITHUB_SECRET: ci-not-a-real-github-client-secret
  # Required from task 42 because `google` is the provider the default chain names (D-46). No test
  # reaches a vendor — every suite generates through the deterministic stub (IR-001-AC-5) — so this
  # value only has to exist, and must not be real.
  GOOGLE_GENERATIVE_AI_API_KEY: ci-not-a-real-google-generative-ai-key
  # Required from the M6 tail (D-73). `none` is the stated absence: CI has no Blob store and no
  # search account, and must reach neither. The end-to-end suite sets the same two values on the
  # application server it starts (playwright.config.ts), so this is belt and braces for any step
  # that evaluates the environment loader directly.
  BLOB_READ_WRITE_TOKEN: none
  WEB_SEARCH_API_KEY: none

jobs:
  verify:
    name: Lint, boundaries, types, unit
    runs-on: ubuntu-latest
    # 15 → 25 when the delivery loop's suites joined this job (task 155). They talk to the runner's
    # Docker daemon and build the executor image — node, apt, and a global npm install — which is a
    # few minutes on a cold layer cache and seconds on a warm one. A bound that cuts off a build
    # which is visibly working reports «the box is too small» instead of anything about the product,
    # which is the failure D-201/D-202 were about.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Constitution A1 / SC-15: asserts the allowed-edge table still rejects forbidden imports.
      # Kept as its own step so a boundary regression is legible in the checks list.
      - name: Module boundaries
        run: pnpm test:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      # The delivery loop is a second package in the same workspace (А-20), and it reports through
      # this job rather than through a new one on purpose: `main` requires this check by name, the
      # executor account cannot edit the required-checks list (D-202), and a red loop must block a
      # merge exactly as a red platform does. Same trick as the local single-user profile — grow
      # what a required check requires, never its name.
      - name: Typecheck (loop)
        run: pnpm loop:typecheck

      - name: Unit tests (loop)
        run: pnpm loop:test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # 90 → 30, and the drop is the point. The monolith ran three engines serially on one runner:
    # ~46 minutes green, an hour when one flaky Firefox test spent its two retries, and a cancellation
    # at the ceiling that read as a red gate while saying nothing except «the box is too small»
    # (D-200/D-201). One engine on its own runner finishes in a third of that, so the box is now sized
    # for one engine plus its retries instead of for the sum of three (А-15).
    #
    # 30 → 55 in task 142's PR, on a measurement rather than a hunch: a green chromium job spent
    # 17 m 02 s in the tests and 4 m 06 s installing system dependencies, leaving nine minutes of
    # slack — less than one retried test. The box was again sized to report «too small» before it
    # reported anything about the product. The apt step below owns its own 25-minute bound, and
    # WebKit's tests take about eighteen minutes, so 55 is that worst case with room left over; on a
    # healthy runner the job still finishes in under twenty.
    timeout-minutes: 55

    strategy:
      # One engine's failure must not cancel the other two. The whole value of the split is that a
      # WebKit-only defect is reported as a WebKit-only defect with the other two verdicts still on
      # the record — D-198/D-199 were exactly that shape, and under fail-fast they would have arrived
      # as two cancellations and a mystery.
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The engine belongs in the cache key. Each job now downloads one browser, so three jobs sharing
      # one key would let whichever finished first save a cache holding only its own engine — and the
      # other two would take that as a hit, skip the install and fail on a browser that is not there.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.engine }}

      # `azure.archive.ubuntu.com` — the mirror GitHub's runners point apt at by default — was
      # observed hanging for over an hour on 2026-08-19: three consecutive runs of the step below
      # died at its 25-minute bound while `archive.ubuntu.com` answered instantly in the same logs.
      # Re-running the job is mirror roulette; pinning apt to the canonical host is deterministic,
      # and it is a *fix*, not the retry D-201/D-202 rejected. `|| true` on each file: which of the
      # two layouts exists depends on the runner image, and a missing one is not an error.
      - name: Pin apt to the canonical Ubuntu mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      # The engine belongs here too, and its absence cost half an hour (task 142's PR).
      #
      # A cached browser still needs its system libraries, but `install-deps` with no argument
      # installs them for **all three** engines — including WebKit's GTK and GStreamer stack, which
      # is the bulk of it. The job that got a cache hit therefore did the most apt work of the three,
      # and on one run that took 29 m 32 s and was killed by the 30-minute job timeout without
      # reaching a single test, while the two jobs that missed the cache installed one engine's
      # dependencies each through `--with-deps` above and finished in about seventeen minutes.
      # A red gate that means "apt was slow installing browsers this job does not run" is exactly
      # the uninformative verdict D-201 and D-202 were about.
      #
      # Bounded, and deliberately NOT retried — the retry was tried on this very PR and made things
      # worse, which is worth writing down rather than quietly deleting.
      #
      # The failure this step has is a hang: `install-deps` is `apt-get update` plus `apt-get
      # install`, and a mirror that stops answering leaves it sitting. Wrapping one attempt in
      # `timeout 300` and looping three times looked obvious and was not: `timeout` kills the command
      # it launched, but `apt-get` is a *grandchild*, so it survived the kill still holding
      # `/var/lib/apt/lists/lock`, and attempts two and three failed in seconds with «Could not get
      # lock … held by process 2275 (apt-get)». A retry that is guaranteed to fail is worse than no
      # retry, because it reads like the problem was given three chances.
      #
      # So: one attempt, with a bound the *step* owns. A stalled mirror is reported as this step
      # timing out, leaving the rest of the job's budget unspent and the fix obvious — re-run this
      # one engine (D-202 made that cheap).
      #
      # The bound is 25 minutes and not the 12 it was first set to, because the first number was
      # measured on the wrong engine. Chromium's dependencies install in about four minutes; WebKit's
      # set is several times larger (GTK, GStreamer, PipeWire, SDL, a soundfont), and on a slow
      # `azure.archive.ubuntu.com` it was still **making progress** — package 126, one every ten to
      # twenty seconds — when twelve minutes ran out. A bound that cuts off a step which is visibly
      # working is the same defect as no bound at all, pointing the other way: it reports a red gate
      # for a mirror having a bad afternoon. On a healthy runner none of this costs anything.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 25
        run: pnpm exec playwright install-deps ${{ matrix.engine }}

      # NFR-011 / SC-12: the smoke test runs on all three engines — one job each now, same three
      # Playwright projects. Edge is covered by the Chromium project (see playwright.config.ts).
      - name: End-to-end tests
        run: pnpm test:e2e --project=${{ matrix.engine }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The same suite against the local single-user deployment (task 148): `LOCAL_SINGLE_USER=1` on the
  # application server, anonymous requests resolving to the fixed owner, the OAuth surface refusing.
  # One engine is enough — the flag changes server behaviour, not rendering engines — and Chromium is
  # the fastest of the three. The specs that assert the OAuth surface skip themselves by the same
  # variable, each with a named reason (e2e/fixtures/local-mode.ts).
  e2e-local:
    name: E2E (chromium, local single-user)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LOCAL_SINGLE_USER: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # Same mirror pin as the engine matrix, same measured reason (see that job's comment).
      - name: Pin apt to the canonical Ubuntu mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list 2>/dev/null || true

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 25
        run: pnpm exec playwright install-deps chromium

      - name: End-to-end tests (local single-user profile)
        run: pnpm test:e2e --project=chromium

      # The delivery loop's dashboard (task 153). It rides in this job because the browsers are
      # already installed here and because the required check's name cannot change (D-202) — a red
      # loop feed must block a merge exactly as a red platform journey does. Its own Playwright
      # configuration builds and starts the loop's server; the two applications never share one.
      - name: End-to-end tests (loop dashboard)
        env:
          LOCAL_SINGLE_USER: ''
        run: pnpm loop:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local-single-user
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The branch-protection gate for the suite above.
  #
  # `main` requires a status check named «End-to-end (Chromium, Firefox, WebKit)» by that exact name,
  # and the executor account has push but not admin — the required-checks list cannot be rewritten
  # from here (D-202; the exact UI steps for the owner are a section of the M12п report). So this job
  # carries the required name and reports the matrix's combined verdict. Strictness is unchanged:
  # three engines still have to pass, and this gate is red unless every one of them did.
  #
  # `if: always()` is load-bearing. Without it, a failed engine leaves this job *skipped*, and branch
  # protection counts a skipped required check as satisfied — the split would have quietly become a
  # way to merge a red suite. It runs regardless and asserts the verdict explicitly.
  e2e-gate:
    name: End-to-end (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    # The local single-user run reports through the same gate (task 148): the required check's NAME
    # cannot change — branch protection lists it verbatim and the executor account cannot edit that
    # list (D-202) — but what it requires can grow, and a red local profile must block a merge
    # exactly as a red engine does.
    needs: [e2e, e2e-local]
    if: always()
    timeout-minutes: 5

    steps:
      # `needs.e2e.result` is the matrix's aggregate: `success` only when every engine succeeded,
      # and `failure`/`cancelled`/`skipped` the moment one did not.
      - name: Every engine passed
        run: |
          result='${{ needs.e2e.result }}'
          echo "Engine matrix verdict: $result"
          test "$result" = success

      - name: The local single-user profile passed
        run: |
          result='${{ needs['e2e-local'].result }}'
          echo "Local profile verdict: $result"
          test "$result" = success
